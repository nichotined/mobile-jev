[project]
name = "mobile-jev"
version = "0.1.0"
description = "mobilecli drop-in with natural-language element targeting via Jev (typesafe.ai)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nicholas Frederich Lagaunne" }, { name = "Benjamin Vollmer" }]
requires-python = ">=3.11"
keywords = ["mobilecli", "mobile-automation", "ai-agents", "jev", "typesafe", "android", "ios"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
mobile-jev = "mobile_jev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["mobile_jev.py"]
